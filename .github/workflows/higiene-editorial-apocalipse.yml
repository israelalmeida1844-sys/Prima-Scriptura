name: Higiene editorial Apocalipse 1–8 (rascunho)
on:
  push:
    branches: [rascunho/apocalipse]
    paths:
      - '.github/workflows/higiene-editorial-apocalipse.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: higiene-editorial-apocalipse
  cancel-in-progress: false
jobs:
  validar:
    if: github.ref == 'refs/heads/rascunho/apocalipse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rascunho/apocalipse
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar transliteração e aplicar higiene editorial
        run: |
          node scripts/testar-transliteracao-apocalipse.mjs
          node scripts/normalizar-transliteracao-apocalipse.mjs --check
          node scripts/higiene-editorial-apocalipse.mjs
          node scripts/higiene-editorial-apocalipse.mjs --check
      - name: Compilar sem publicar
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Registrar alterações e relatório de pendências
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/texto-original/apocalipse/apocalipse-[1-8]-*.ts src/components/TextoOriginalApocalipse[1-8]v*.astro src/data/lexico-grego/apocalipse-*.json docs/auditoria-editorial-apocalipse-1-8.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(apocalipse): higiene de glosas e referências; registrar pendências'
            git push origin HEAD:rascunho/apocalipse
          fi
