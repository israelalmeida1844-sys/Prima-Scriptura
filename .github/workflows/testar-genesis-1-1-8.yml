name: Teste Chromium de Gênesis 1:1–8 (rascunho)
on:
  push:
    branches: [rascunho/genesis]
    paths: ['.github/workflows/testar-genesis-1-1-8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rascunho/genesis
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Astro, Playwright e Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compilar sem deploy
        run: npm run build
      - name: Verificar interlinear e responsividade (1440, 390, 320 px)
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 > /tmp/astro-gn1.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/rascunhos/genesis-1-8/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/testar-genesis-1-1-8-browser.mjs
