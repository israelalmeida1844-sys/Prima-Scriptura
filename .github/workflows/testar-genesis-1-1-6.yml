name: Teste integral de Gênesis 1:1–6 (somente rascunho)
# Verifica a tradução alternativa do segundo versículo e a revisão filológica do sexto.
on:
  push:
    branches: [rascunho/genesis]
    paths: ['.github/workflows/testar-genesis-1-1-6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rascunho/genesis
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Astro e Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compilar Astro sem publicar
        run: npm run build
      - name: Executar os testes de seis versículos
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 > /tmp/genesis-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/rascunhos/genesis-1-6/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/testar-genesis-1-1-6-browser.mjs
