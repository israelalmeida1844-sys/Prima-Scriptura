name: Homologacao Apocalipse capitulos 1 e 2 completos

on:
  push:
    branches:
      - rascunho/apocalipse
    paths-ignore:
      - '.github/reports/**'
  workflow_dispatch:

concurrency:
  group: homologacao-apocalipse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Obter fontes acadêmicas fixadas
        run: |
          git clone --quiet https://github.com/morphgnt/sblgnt.git /tmp/prima-morphgnt
          git -C /tmp/prima-morphgnt checkout --quiet aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
          git clone --quiet https://github.com/jtauber/greek-lemma-mappings.git /tmp/prima-lemma-mappings
          test "$(git -C /tmp/prima-lemma-mappings hash-object lexemes.yaml)" = "a5cd101e445e51eb67fe05aceb06a14b991d41f2"
      - name: Padronizar transliteracao academica
        run: node scripts/normalizar-transliteracao-apocalipse.mjs
      - name: Gerar concordancias gregas exaustivas
        run: node scripts/generate-apocalipse-1-9-20-concordancias.mjs
      - name: Sincronizar notas com glosas revistas
        run: node scripts/ajustar-explicacoes-interlinear-apocalipse.mjs
      - name: Auditar filologia dos 276 tokens
        id: philology
        run: node scripts/auditar-filologia-apocalipse.mjs
      - name: Gerar 12 versiculos e componentes do capitulo 2
        id: generate2
        run: node scripts/generate-apocalipse-2-1-12.mjs
      - name: Revisar glosas contextuais do capitulo 2
        run: node scripts/revisar-glossas-apocalipse-2.mjs
      - name: Revisar verbetes lexicais essenciais do capitulo 2
        run: node scripts/revisar-lexico-apocalipse-2.mjs
      - name: Gerar concordancias do capitulo 2
        id: concord2
        run: node scripts/generate-apocalipse-2-1-12-concordancias.mjs
      - name: Auditar 2:1-12 contra fonte grega e Strong
        id: philology2
        run: node scripts/auditar-filologia-apocalipse-2.mjs
      - name: Gerar dados e componentes de Apocalipse 2:13-29
        id: generate229
        run: node scripts/generate-apocalipse-2-13-29.mjs
      - name: Revisar glosas de Apocalipse 2:13-29
        run: node scripts/revisar-glossas-apocalipse-2-13-29.mjs
      - name: Revisar o léxico crítico de Apocalipse 2:13-29
        run: node scripts/revisar-lexico-apocalipse-2-13-29.mjs
      - name: Gerar concordancias de Apocalipse 2:13-29
        id: concord229
        run: node scripts/generate-apocalipse-2-13-29-concordancias.mjs
      - name: Auditoria filologica dos 358 tokens de 2:13-29
        id: philology229
        run: node scripts/auditar-filologia-apocalipse-2-13-29.mjs
      - name: Aplicar revisão editorial conservadora das relações sintáticas
        run: node scripts/revisao-editorial-apocalipse-2.mjs
      - name: Salvar fontes geradas do capítulo 2 em rascunho antes do build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/texto-original/apocalipse/apocalipse-2-* src/data/lexico-grego/apocalipse-2-*.json src/components/TextoOriginalApocalipse2v*.astro public/data/concordancia-grega/ .github/reports/apocalipse-2-1-12-filologia.json .github/reports/apocalipse-2-13-29-filologia.json
          git diff --cached --quiet || (git commit -m "feat(apocalipse): gera dados completos do capítulo 2 em rascunho" && git push origin HEAD:rascunho/apocalipse)
      - name: Compilar Astro
        id: build
        run: npm run build
      - name: Verificar 49 rotas e arquivos de concordancia
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          page_count=$(find dist -name index.html -type f | wc -l)
          echo "Páginas HTML estáticas geradas: $page_count"
          if [ "$page_count" -lt 100 ]; then
            echo "O build gerou menos de 100 páginas estáticas" >&2
            exit 1
          fi
          for v in {1..20}; do
            test -s "dist/comentarios/apocalipse/capitulo-1/versiculo-$v/index.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const verses = Array.from({length:18}, (_,i)=>i+3);
          const expected = [20,31,33,22,25,21,32,15,31,15,17,20,18,30,28,24,13,33];
          for (const [i,v] of verses.entries()) {
            const file = fs.readFileSync(`src/data/texto-original/apocalipse/apocalipse-1-${v}.ts`, 'utf8');
            const match = file.match(/=\s*(\{[\s\S]*\})\s*as const;/);
            if (!match) throw new Error(`Dados TS nao interpretaveis em 1:${v}`);
            const obj=JSON.parse(match[1]);
            if(obj.words.length!==expected[i]) throw new Error(`Quantidade incorreta de tokens em 1:${v}`);
            for (const w of obj.words) {
              if(w.morphologyCode.length!==8) throw new Error(`Morph invalido: ${w.id}`);
              const index = `public/data/concordancia-grega/${w.strong}.json`;
              if(!fs.existsSync(index)) throw new Error(`Concordancia ausente: ${index}`);
              const data = JSON.parse(fs.readFileSync(index, 'utf8'));
              if(data.complete !== true || data.references.length!==data.verseCount) throw new Error(`Concordancia invalida: ${w.strong}`);
            }
          }
          for (let v=1; v<=29; v++) {
            const route='dist/comentarios/apocalipse/capitulo-2/versiculo-'+v+'/index.html';
            if(!fs.existsSync(route))throw new Error('Rota ausente: '+route);
            const file=fs.readFileSync('src/data/texto-original/apocalipse/apocalipse-2-'+v+'.ts','utf8');
            const match=file.match(/=\s*(\{[\s\S]*\})\s*as const;/);
            if(!match)throw new Error('Sem dados do versículo '+v);
            const data=JSON.parse(match[1]);
            for(const w of data.words){
              const j='public/data/concordancia-grega/'+w.strong+'.json';
              if(!fs.existsSync(j))throw new Error('Concordância ausente: '+j);
              const idx=JSON.parse(fs.readFileSync(j,'utf8'));
              if(!idx.complete||!Array.isArray(idx.references))throw new Error('Concordância inválida: '+j);
            }
          }
          console.log('PASSOU: 49 rotas de Apocalipse (20+29), morfologia e concordancias.');
          NODE

      - name: Registrar resultado da homologacao no repositorio
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PHILOLOGY_OUTCOME: ${{ steps.philology.outcome }}
          PHILOLOGY2_OUTCOME: ${{ steps.philology2.outcome }}
          GENERATE2_OUTCOME: ${{ steps.generate2.outcome }}
          CONCORD2_OUTCOME: ${{ steps.concord2.outcome }}
          GENERATE229_OUTCOME: ${{ steps.generate229.outcome }}
          CONCORD229_OUTCOME: ${{ steps.concord229.outcome }}
          PHILOLOGY229_OUTCOME: ${{ steps.philology229.outcome }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p .github/reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { BUILD_OUTCOME, AUDIT_OUTCOME, VERIFIED_COMMIT, PHILOLOGY2_OUTCOME, GENERATE2_OUTCOME, CONCORD2_OUTCOME, PHILOLOGY_OUTCOME, GENERATE229_OUTCOME, CONCORD229_OUTCOME, PHILOLOGY229_OUTCOME } = process.env;
          fs.writeFileSync('.github/reports/apocalipse-1-3-20.json', JSON.stringify({
            checkedCommit: VERIFIED_COMMIT,
            node: '22',
            build: BUILD_OUTCOME,
            staticRoutesAndConcordances: AUDIT_OUTCOME,
            philologicalSourceAlignment: PHILOLOGY_OUTCOME,
            chapter2SourceAlignment: PHILOLOGY2_OUTCOME,
            chapter2Generation: GENERATE2_OUTCOME,
            chapter2Concordances: CONCORD2_OUTCOME,
            chapter2Verses13to29Generation: GENERATE229_OUTCOME,
            chapter2Verses13to29Concordances: CONCORD229_OUTCOME,
            chapter2Verses13to29SourceAlignment: PHILOLOGY229_OUTCOME,
            approved: BUILD_OUTCOME === 'success' && AUDIT_OUTCOME === 'success' && PHILOLOGY_OUTCOME === 'success' && PHILOLOGY2_OUTCOME === 'success' && GENERATE2_OUTCOME === 'success' && CONCORD2_OUTCOME === 'success' && GENERATE229_OUTCOME === 'success' && CONCORD229_OUTCOME === 'success' && PHILOLOGY229_OUTCOME === 'success',
            source: 'GitHub Actions / homologacao-apocalipse.yml'
          }, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reports/apocalipse-1-3-20.json .github/reports/apocalipse-2-1-12-filologia.json .github/reports/apocalipse-2-13-29-filologia.json src/data/texto-original/apocalipse/apocalipse-2-* src/data/lexico-grego/apocalipse-2-*.json src/components/TextoOriginalApocalipse2v*.astro public/data/concordancia-grega/
          git diff --cached --quiet || git commit -m "feat(apocalipse): implementa e homologa Apocalipse 2 completo"
          git push origin HEAD:rascunho/apocalipse
