name: Homologacao Apocalipse 1-20

on:
  push:
    branches:
      - rascunho/apocalipse
    paths-ignore:
      - '.github/reports/**'
  workflow_dispatch:

concurrency:
  group: homologacao-apocalipse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Obter fontes acadêmicas fixadas
        run: |
          git clone --quiet https://github.com/morphgnt/sblgnt.git /tmp/prima-morphgnt
          git -C /tmp/prima-morphgnt checkout --quiet aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
          git clone --quiet https://github.com/jtauber/greek-lemma-mappings.git /tmp/prima-lemma-mappings
          test "$(git -C /tmp/prima-lemma-mappings hash-object lexemes.yaml)" = "a5cd101e445e51eb67fe05aceb06a14b991d41f2"
      - name: Padronizar transliteracao academica
        run: node scripts/normalizar-transliteracao-apocalipse.mjs
      - name: Gerar concordancias gregas exaustivas
        run: node scripts/generate-apocalipse-1-9-20-concordancias.mjs
      - name: Auditar filologia dos 276 tokens
        id: philology
        run: node scripts/auditar-filologia-apocalipse.mjs
      - name: Registrar concordancias novas na branch de rascunho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/concordancia-grega src/data/lexico-grego/apocalipse-1-9-20-concordancias-relatorio.json src/data/lexico-grego/apocalipse-1-9-20.json src/data/texto-original/apocalipse .github/reports/apocalipse-1-9-20-filologia.json
          git diff --cached --quiet || (git commit -m "feat(apocalipse): concordancias canonicas verificadas para 1:9-20" && git push origin HEAD:rascunho/apocalipse)
      - name: Compilar Astro
        id: build
        run: npm run build
      - name: Verificar oito rotas e arquivos de concordancia
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          page_count=$(find dist -name index.html -type f | wc -l)
          echo "Páginas HTML estáticas geradas: $page_count"
          if [ "$page_count" -lt 87 ]; then
            echo "O build gerou menos de 87 páginas estáticas" >&2
            exit 1
          fi
          for v in {1..20}; do
            test -s "dist/comentarios/apocalipse/capitulo-1/versiculo-$v/index.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const verses = Array.from({length:18}, (_,i)=>i+3);
          const expected = [20,31,33,22,25,21,32,15,31,15,17,20,18,30,28,24,13,33];
          for (const [i,v] of verses.entries()) {
            const file = fs.readFileSync(`src/data/texto-original/apocalipse/apocalipse-1-${v}.ts`, 'utf8');
            const match = file.match(/=\s*(\{[\s\S]*\})\s*as const;/);
            if (!match) throw new Error(`Dados TS nao interpretaveis em 1:${v}`);
            const obj=JSON.parse(match[1]);
            if(obj.words.length!==expected[i]) throw new Error(`Quantidade incorreta de tokens em 1:${v}`);
            for (const w of obj.words) {
              if(w.morphologyCode.length!==8) throw new Error(`Morph invalido: ${w.id}`);
              const index = `public/data/concordancia-grega/${w.strong}.json`;
              if(!fs.existsSync(index)) throw new Error(`Concordancia ausente: ${index}`);
              const data = JSON.parse(fs.readFileSync(index, 'utf8'));
              if(data.complete !== true || data.references.length!==data.verseCount) throw new Error(`Concordancia invalida: ${w.strong}`);
            }
          }
          console.log('PASSOU: 428 tokens, 20 rotas, morfologia e concordancias.');
          NODE

      - name: Registrar resultado da homologacao no repositorio
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PHILOLOGY_OUTCOME: ${{ steps.philology.outcome }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p .github/reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { BUILD_OUTCOME, AUDIT_OUTCOME, VERIFIED_COMMIT } = process.env;
          fs.writeFileSync('.github/reports/apocalipse-1-3-20.json', JSON.stringify({
            checkedCommit: VERIFIED_COMMIT,
            node: '22',
            build: BUILD_OUTCOME,
            staticRoutesAndConcordances: AUDIT_OUTCOME,
            philologicalSourceAlignment: PHILOLOGY_OUTCOME,
            approved: BUILD_OUTCOME === 'success' && AUDIT_OUTCOME === 'success' && PHILOLOGY_OUTCOME === 'success',
            source: 'GitHub Actions / homologacao-apocalipse.yml'
          }, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reports/apocalipse-1-3-20.json
          git commit -m "ci(apocalipse): registra resultado verificavel de homologacao" || true
          git push origin HEAD:rascunho/apocalipse
