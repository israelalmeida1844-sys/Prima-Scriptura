name: Teste do motor Gemini (comentários)
on:
  push:
    branches: [rascunho/comentarios-portugues]
    paths: ['.github/workflows/teste-gemini-comentarios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes locais
        run: node scripts/commentaries/translate-all.mjs --self-test
      - name: Uma chamada ao Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.GEMINI_API_KEY) throw Error("Segredo não configurado");
          const base="https://generativelanguage.googleapis.com/v1beta/";
          const headers={"x-goog-api-key":process.env.GEMINI_API_KEY};
          const models=[];
          let page="";
          do {
            const url=base+"models?pageSize=100"+(page?"&pageToken="+encodeURIComponent(page):"");
            const list=await fetch(url,{headers});
            if(!list.ok)throw Error("Listagem de modelos HTTP "+list.status);
            const data=await list.json();
            models.push(...(data.models||[]));
            page=data.nextPageToken||"";
          }while(page);
          const available=models.filter(m=>m.supportedGenerationMethods?.includes("generateContent"));
          console.log("Modelos disponíveis:",available.map(m=>m.name).join(", "));
          const allowed=available.filter(m=>/^models\/gemini-[\d.]+-flash(?:-lite)?$/.test(m.name));
          const selected=allowed.sort((a,b)=>Number(b.name.includes("lite"))-Number(a.name.includes("lite"))||b.name.localeCompare(a.name,undefined,{numeric:true}))[0];
          if(!selected)throw Error("Nenhum modelo Flash estável disponível; confira a lista.");
          console.log("Modelo selecionado:",selected.name);
          const response = await fetch(base+selected.name+":generateContent", {
            method:"POST",
            headers:{"x-goog-api-key":process.env.GEMINI_API_KEY,"content-type":"application/json"},
            body:JSON.stringify({contents:[{parts:[{text:"Translate into Brazilian Portuguese, without commentary: Blessed is he who reads and keeps the words of this prophecy."}]}],generationConfig:{maxOutputTokens:256,temperature:0}})
          });
          if (!response.ok) throw Error("Gemini HTTP "+response.status);
          const data=await response.json();
          const result=data.candidates?.[0];
          if(result?.finishReason!=="STOP") throw Error("Resposta incompleta");
          const translation=result.content?.parts?.filter(x=>!x.thought).map(x=>x.text||"").join("").trim();
          if(!translation || !/profecia/i.test(translation)) throw Error("Tradução não reconhecida");
          console.log("Motor conectado. Tradução:",translation);
          JS
