name: Teste do motor Gemini (comentários)
on:
  push:
    branches: [rascunho/comentarios-portugues]
    paths: ['.github/workflows/teste-gemini-comentarios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes locais
        run: node scripts/commentaries/translate-all.mjs --self-test
      - name: Uma chamada ao Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: |
          node --input-type=module <<'JS'
          if (!process.env.GEMINI_API_KEY) throw Error("Segredo não configurado");
          const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+process.env.GEMINI_MODEL+":generateContent", {
            method:"POST",
            headers:{"x-goog-api-key":process.env.GEMINI_API_KEY,"content-type":"application/json"},
            body:JSON.stringify({contents:[{parts:[{text:"Translate into Brazilian Portuguese, without commentary: Blessed is he who reads and keeps the words of this prophecy."}]}],generationConfig:{maxOutputTokens:256,temperature:0}})
          });
          if (!response.ok) throw Error("Gemini HTTP "+response.status);
          const data=await response.json();
          const result=data.candidates?.[0];
          if(result?.finishReason!=="STOP") throw Error("Resposta incompleta");
          const translation=result.content?.parts?.filter(x=>!x.thought).map(x=>x.text||"").join("").trim();
          if(!translation || !/profecia/i.test(translation)) throw Error("Tradução não reconhecida");
          console.log("Motor conectado. Tradução:",translation);
          JS
