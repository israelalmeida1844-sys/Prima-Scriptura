name: Apocalipse 3 — validar dados auditados 1–6
on:
  push:
    branches: [rascunho/apocalipse]
    paths:
      - '.github/workflows/validar-apocalipse-3-1-6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    if: github.ref == 'refs/heads/rascunho/apocalipse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obter corpus fixado
        run: |
          git clone --quiet https://github.com/morphgnt/sblgnt.git /tmp/prima-morphgnt
          git -C /tmp/prima-morphgnt checkout --quiet aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
      - name: Validar sem sobrescrever a edição auditada
        run: python3 scripts/validar-apocalipse3-estatico.py /tmp/prima-morphgnt 6
      - name: Compilar sem publicar
        run: |
          npm install --no-audit --no-fund
          npm run build
          for v in $(seq 1 6); do
            test -s "dist/comentarios/apocalipse/capitulo-3/versiculo-$v/index.html"
          done
